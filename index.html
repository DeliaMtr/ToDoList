<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do list </title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="container">
        <div class="toDo">
            <h1>𝐓𝐨 𝐃𝐨 𝐋𝐢𝐬𝐭 𝐀𝐝𝐞𝐥<img src="image/foto.png"></h1>
            <div class="row">
                <input type="text" id="inputTask" placeholder="𝐚𝐲𝐨𝐨 𝐦𝐚𝐬𝐮𝐤𝐢𝐧 𝐭𝐨 𝐝𝐨 𝐥𝐢𝐬𝐭 𝐤𝐚𝐦𝐮𝐮">
                <button id="tombol">𝐭𝐚𝐦𝐛𝐚𝐡</button>
            </div>
            <ul id="listContainer">
            </ul>
            <div class="stats">
                <p>𝐘𝐞𝐲 𝐒𝐮𝐝𝐚𝐡: <span id="totalCount">0</span></p>
                <p>𝐂𝐞𝐥𝐞𝐜𝐚𝐢: <span id="doneCount">0</span></p>
                <p>𝐘𝐚𝐡 𝐁𝐞𝐥𝐮𝐦: <span id="pendingCount">0</span></p>
            </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
